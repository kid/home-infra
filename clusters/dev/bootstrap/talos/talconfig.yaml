---
clusterName: dev
talosVersion: ${TALOS_VERSION}
kubernetesVersion: ${KUBERNETES_VERSION}
endpoint: https://10.0.10.100:6443
# domain: ${CLUSTER_DOMAIN}
allowSchedulingOnMasters: true
# additionalMachineCertSans:
#   - 192.168.200.10
# additionalApiServerCertSans:
#   - 10.0.40.11
clusterPodNets:
  - 10.244.0.0/16
clusterSvcNets:
  - 10.96.0.0/12
cniConfig:
  name: none
patches:
  - |-
    cluster:
      proxy:
        disabled: true
  - |-
    machine:
      install:
        extraKernelArgs:
          - amd_pstate=active
          - pcie_aspm=force
  - |-
    machine:
      sysfs:
        devices.system.cpu.cpu0.cpufreq.scaling_governor: powersave
        devices.system.cpu.cpu0.cpufreq.energy_performance_preference: power
nodes:
  - hostname: pve0
    ipAddress: 10.0.10.100
    installDisk: /dev/sda
    controlPlane: true
controlPlane:
  networkInterfaces:
    - interface: enp36s0f0
      ignore: true
    - interface: enp36s0f1
      ignore: true
    - interface: enp38s0
      dhcp: true
      # vip:
      #   ip: 10.0.40.10
    - interface: enp39s0
      ignore: true
    - interface: enp45s0f1np0
      ignore: true
    - interface: enp45s0f1np0
      ignore: true
    - interface: bond0
      dhcp: false
      bond:
        mode: 802.3ad
        interfaces:
          - enp45s0f1np0
          - enp45s0f1np1
